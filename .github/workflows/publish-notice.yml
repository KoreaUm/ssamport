name: Publish Update Notice

on:
  workflow_dispatch:
    inputs:
      version:
        description: "공지를 배포할 버전 (예: 2.0.133). 비워두면 main 브랜치 package.json 버전을 사용합니다."
        required: false
        default: ""

jobs:
  publish-notice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish in-app update notice
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          NOTICE_VERSION: ${{ inputs.version }}
        run: npm run notice:publish
